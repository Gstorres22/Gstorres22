name: Gerar cobrinha

# A cobrinha "come" o gráfico de contribuições, que já soma os commits de
# todos os seus repositórios. Roda a cada 12h, manualmente ou a cada push na main.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7c3aed&color_dots=#ebedf0,#c7d7fe,#93b4fd,#70a5fd,#4f6fd8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#bf91f3&color_dots=#161b22,#1e2a4a,#30508f,#4f7fd8,#70a5fd

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
